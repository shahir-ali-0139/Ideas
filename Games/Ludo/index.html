<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ludo - Vanilla JS</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    
    <section class="game-area">
      <div style="text-align:center; margin-bottom:10px;">
        <h1>🎲 Ludo</h1>
      </div>

      <div class="board-wrap">
        <div id="board" class="board" aria-label="Ludo board"></div>
        <div id="tokens-layer" class="tokens-layer"></div>
        <div class="dice-panel center-dice">
          <div
            id="dice"
            class="dice"
            role="button"
            tabindex="0"
            aria-label="Roll dice"
            title="Click to roll"
          ></div>
        </div>
      </div>
    </section>

    <!-- UI Panel: Players | Action Buttons | Mode Switches -->
    <section class="hud">
      <div class="card scoreboard-card">
        
        <!-- Left side: Player count -->
        <div class="controls left-controls" id="player-settings-panel">
          <label class="control-drawer">
            <span class="control-title">Players:</span>
            <div class="drawer-select" data-target-select="player-count">
              <button
                type="button"
                class="drawer-toggle"
                aria-expanded="false"
                aria-controls="player-count-drawer"
              >
                <span class="drawer-value">4</span>
                <span class="drawer-chevron">▾</span>
              </button>
              <div id="player-count-drawer" class="drawer-menu" role="listbox">
                <button type="button" class="drawer-option" data-value="2">2 Players</button>
                <button type="button" class="drawer-option" data-value="3">3 Players</button>
                <button type="button" class="drawer-option" data-value="4">4 Players</button>
              </div>
              <select id="player-count" class="native-select-hidden">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4" selected>4</option>
              </select>
            </div>
          </label>
        </div>

        <!-- Center: Game Actions -->
        <div class="game-action-center">
          <button id="start-toggle">Start</button>
          <button id="restart-game">Restart</button>
        </div>
        
        <!-- Right side: Scoreboard/Robot toggles -->
        <div class="scoreboard" id="scoreboard"></div>

      </div>
    </section>

    <!-- Color Customizer -->
    <section class="card color-customizer" id="color-settings-panel">
      <div class="customizer-header">
        <span class="control-title">Customize Player Colors</span>
        <button id="reset-colors" class="reset-btn">Reset</button>
      </div>
      
      <div class="color-inputs">
        <label class="color-label">Cage 1 <input type="text" id="color-red-text" placeholder="#ff0000 or red"></label>
        <label class="color-label">Cage 2 <input type="text" id="color-green-text" placeholder="#00ff00 or green"></label>
        <label class="color-label">Cage 3 <input type="text" id="color-yellow-text" placeholder="#ffff00 or yellow"></label>
        <label class="color-label">Cage 4 <input type="text" id="color-blue-text" placeholder="#0000ff or blue"></label>
      </div>
    </section>
  </main>

  <div id="winner-modal" class="winner-modal hidden" role="dialog" aria-modal="true">
    <div class="winner-card">
      <h2 id="winner-text">Red wins!</h2>
      <p>All 4 tokens reached home. Great game!</p>
      <button id="play-again">Play Again</button>
    </div>
  </div>
   <script src="script.js" defer></script>
</body>
</html>
