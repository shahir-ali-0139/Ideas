<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>  Chess — Automated Integration Test Suite</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .test-header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .summary-card {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }
    .metric-pill {
      padding: 12px 20px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 140px;
    }
    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .metric-value {
      font-size: 1.5rem;
      font-weight: 800;
      font-family: var(--font-mono);
    }
    .metric-passed { color: var(--accent-emerald); }
    .metric-failed { color: var(--accent-rose); }
    .metric-total { color: var(--accent-cyan); }
    .metric-duration { color: var(--accent-violet); }
    
    .integration-layout {
      display: grid;
      grid-template-columns: 1fr 480px;
      gap: 24px;
      align-items: start;
    }

    .test-suite-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .suite-header {
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border-glass);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-item {
      padding: 10px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .test-main-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-name {
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .test-status-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-family: var(--font-mono);
      text-transform: uppercase;
    }
    .badge-pass {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .badge-fail {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent-rose);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .failure-detail {
      margin-top: 6px;
      padding: 10px 14px;
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid var(--accent-crimson);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #fca5a5;
      white-space: pre-wrap;
    }

    /* Live Sandbox Iframe for Integration Verification */
    .sandbox-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass-cyan);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .sandbox-header {
      padding: 10px 16px;
      background: rgba(0, 240, 255, 0.1);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #sandbox-frame {
      width: 100%;
      height: 600px;
      border: none;
      background: #080d1a;
    }
  </style>
</head>
<body>

  <!-- Ambient Light Orbs -->
  <div class="space-backdrop" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <div class="test-header">
    <div>
      <h1 style="font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #fff, var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          Chess — Integration Test Suite
      </h1>
      <p style="font-size: 0.88rem; color: var(--text-secondary);">
        End-to-end DOM integration, user clicks, drag-and-drop, promotion modal, FEN/PGN import/export, and clock interactions.
      </p>
    </div>
    <div style="display: flex; gap: 10px;">
      <a href="../index.html" class="btn btn-sm">Launch Chess App ♟</a>
      <a href="unit-tests.html" class="btn btn-sm">Unit Tests 🧪</a>
      <button class="btn btn-sm btn-primary" id="btn-rerun-integration">Run All E2E Tests 🔄</button>
    </div>
  </div>

  <!-- Metric Summary Cards -->
  <div class="summary-card">
    <div class="metric-pill">
      <span class="metric-label">Total Tests</span>
      <span class="metric-value metric-total" id="stat-total">0</span>
    </div>
    <div class="metric-pill">
      <span class="metric-label">Passed</span>
      <span class="metric-value metric-passed" id="stat-passed">0</span>
    </div>
    <div class="metric-pill">
      <span class="metric-label">Failed</span>
      <span class="metric-value metric-failed" id="stat-failed">0</span>
    </div>
    <div class="metric-pill">
      <span class="metric-label">Duration</span>
      <span class="metric-value metric-duration" id="stat-duration">0ms</span>
    </div>
  </div>

  <div class="integration-layout">
    <!-- Test Results Feed -->
    <div id="integration-results-container"></div>

    <!-- Live Execution Sandbox Frame -->
    <div class="sandbox-container">
      <div class="sandbox-header">
        <span>LIVE APP SANDBOX (DOM E2E)</span>
        <span id="sandbox-status" style="font-family: var(--font-mono);">Ready</span>
      </div>
      <iframe id="sandbox-frame" src="../index.html"></iframe>
      <div id="fallback-sandbox" style="display:none; padding:10px;"></div>
    </div>
  </div>

  <script src="../script.js"></script>
  <script src="integration-tests.js"></script>
</body>
</html>
